apiVersion: v2
name: metranova
description: Umbrella chart that deploys the MetraNova stack components
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: clickhouse
    version: 0.0.3
    repository: file://../clickhouse
    condition: clickhouse.enabled
  - name: kafka
    version: 0.2.0
    repository: file://../kafka
    condition: kafka.enabled
  - name: telegraf
    version: 0.1.0
    repository: file://../telegraf
    condition: telegraf.enabled
  - name: pmacct
    version: 0.1.2
    repository: file://../pmacct
    condition: pmacct.enabled
  - name: metranova-snmp-pipeline
    alias: snmpPipeline
    version: 0.1.0
    repository: file://../snmp-pipeline
    condition: snmpPipeline.enabled
  - name: metranova-flow-pipeline
    alias: flowPipeline
    version: 0.1.0
    repository: file://../flow-pipeline
    condition: flowPipeline.enabled
  - name: metranova-api
    alias: api
    version: 0.1.0
    repository: file://../api
    condition: api.enabled
  - name: grafana
    version: ^8.0.0
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
