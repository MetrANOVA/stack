{{- if .Values.metadataCric.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metranova-flow-pipeline.fullname" . }}-metadata-cric
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-cric
spec:
  replicas: {{ .Values.metadataCric.replicaCount }}
  selector:
    matchLabels:
      {{- include "metranova-flow-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metadata-cric
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "metranova-flow-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metadata-cric
    spec:
      {{- include "metranova-flow-pipeline.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "metranova-flow-pipeline.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: metadata-cric
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: DEBUG
          value: {{ .Values.config.debug | quote }}
        - name: PIPELINE_YAML
          value: {{ .Values.metadataCric.env.pipelineYaml | quote }}
        - name: CLICKHOUSE_METADATA_FORCE_UPDATE
          value: {{ .Values.metadataCric.env.clickhouseMetadataForceUpdate | quote }}
        - name: HTTP_CONSUMER_ENV_PREFIX
          value: {{ .Values.metadataCric.env.httpConsumerEnvPrefix | quote }}
        - name: CRIC_IP_HTTP_CONSUMER_URLS
          value: {{ .Values.metadataCric.env.cricIpHttpConsumerUrls | quote }}
        - name: CRIC_IP_HTTP_CONSUMER_UPDATE_INTERVAL
          value: {{ .Values.metadataCric.env.cricIpHttpConsumerUpdateInterval | quote }}
        - name: CRIC_URL_MATCH_PATTERN
          value: {{ .Values.metadataCric.env.cricUrlMatchPattern | quote }}
        - name: CLICKHOUSE_HOST
          value: {{ include "metranova-flow-pipeline.clickhouseHost" . | quote }}
        - name: CLICKHOUSE_PORT
          value: {{ .Values.config.clickhouse.port | quote }}
        - name: CLICKHOUSE_DATABASE
          value: {{ .Values.config.clickhouse.database | quote }}
        - name: CLICKHOUSE_USERNAME
          value: {{ .Values.config.clickhouse.username | quote }}
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "metranova-flow-pipeline.clickhousePasswordSecretName" . }}
              key: {{ include "metranova-flow-pipeline.clickhousePasswordSecretKey" . }}
        - name: CLICKHOUSE_BATCH_SIZE
          value: {{ .Values.config.clickhouse.batchSize | quote }}
        - name: CLICKHOUSE_BATCH_TIMEOUT
          value: {{ .Values.config.clickhouse.batchTimeout | quote }}
        - name: CLICKHOUSE_SCIREG_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.scireg | quote }}
        - name: CLICKHOUSE_IF_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.interface | quote }}
        - name: CLICKHOUSE_DEVICE_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.device | quote }}
        - name: CLICKHOUSE_ORGANIZATION_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.organization | quote }}
        - name: CLICKHOUSE_CIRCUIT_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.circuit | quote }}
        - name: CLICKHOUSE_AS_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.as | quote }}
        - name: CLICKHOUSE_IP_METADATA_TABLE
          value: {{ .Values.config.clickhouse.tables.ip | quote }}
        - name: CLICKHOUSE_CLUSTER_NAME
          value: {{ .Values.config.clickhouse.clusterName | default "" | quote }}
        - name: CLICKHOUSE_REPLICATION
          value: {{ .Values.config.clickhouse.replication | default "false" | quote }}
        - name: CLICKHOUSE_REPLICA_PATH
          value: {{ .Values.config.clickhouse.replicaPath | default "/clickhouse/tables/{shard}/{database}/{table}" | quote }}
        - name: CLICKHOUSE_REPLICA_NAME
          value: {{ .Values.config.clickhouse.replicaName | default "{replica}" | quote }}
        resources:
          {{- toYaml .Values.metadataCric.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
