{{- if not .Values.configFiles.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metranova-flow-pipeline.fullname" . }}-config-core
  {{- if .Values.configFiles.argocdReplaceLargeConfigMaps }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  {{- end }}
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
data: {}
{{- if .Values.configFiles.metaInterface }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metranova-flow-pipeline.fullname" . }}-config-meta-interface
  {{- if .Values.configFiles.argocdReplaceLargeConfigMaps }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  {{- end }}
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
data:
  meta_interface.yml: |
    {{- .Values.configFiles.metaInterface | nindent 4 }}
{{- end }}
