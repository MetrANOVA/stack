  {{- end }}
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
data:
  meta_application.yml: |
    {{- .Values.configFiles.metaApplication | default (.Files.Get "files/meta_application.yml") | nindent 4 }}
{{- end }}
