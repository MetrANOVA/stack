{{- if .Values.cacheIpTrie.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metranova-flow-pipeline.fullname" . }}-nginx-config
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
        
        # Disable access logs for health checks
        location = /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
{{- end }}
