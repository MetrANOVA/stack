apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metranova-auth.fullname" . }}-keycloak
  labels:
    {{- include "metranova-auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "metranova-auth.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-keycloak.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "metranova-auth.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      {{- include "metranova-auth.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "metranova-auth.serviceAccountName" . }}
      securityContext:
        {{- $sc := deepCopy (.Values.podSecurityContext | default dict) }}
        {{- if .Values.keycloak.persistence.enabled }}
        {{- $_ := set $sc "fsGroup" 1000 }}
        {{- end }}
        {{- toYaml $sc | nindent 8 }}
      containers:
        - name: keycloak
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            - start-dev
            - --import-realm
            - --health-enabled=true
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "metranova-auth.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "metranova-auth.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: dev-file
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "https://{{ .Values.domain }}"
            - name: KC_PROXY_HEADERS
              value: xforwarded
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- if .Values.keycloak.persistence.enabled }}
            - name: keycloak-data
              mountPath: /opt/keycloak/data/h2
            {{- end }}
      volumes:
        - name: realm-config
          configMap:
            name: {{ include "metranova-auth.fullname" . }}-keycloak
        {{- if .Values.keycloak.persistence.enabled }}
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: {{ include "metranova-auth.fullname" . }}-keycloak-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
