{{- if not .Values.envoy.tls.existingTLSSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metranova-auth.fullname" . }}-tls
  labels:
    {{- include "metranova-auth.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.envoy.tls.cert | quote }}
  tls.key: {{ .Values.envoy.tls.key | quote }}
  # Envoy reads these filenames from envoy.yaml
  server.crt: {{ .Values.envoy.tls.cert | quote }}
  server.key: {{ .Values.envoy.tls.key | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metranova-auth.fullname" . }}-secrets
  labels:
    {{- include "metranova-auth.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUsername | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  LDAP_ADMIN_PASSWORD: {{ .Values.openldap.adminPassword | quote }}
  LDAP_CONFIG_PASSWORD: {{ .Values.openldap.configPassword | quote }}
  TOKEN_STORE_ENCRYPTION_KEY: {{ .Values.tokenStore.encryptionKey | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  GRAFANA_CLICKHOUSE_PASSWORD: {{ .Values.grafana.clickhousePassword | quote }}
  # Envoy SDS secret files — watched from /etc/envoy/secrets/
  token.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: token-secret
      generic_secret:
        secret:
          inline_string: {{ .Values.envoy.oidcClientSecret | quote }}
  hmac.yaml: |
    resources:
    - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
      name: hmac-secret
      generic_secret:
        secret:
          inline_string: {{ .Values.envoy.hmacSecret | quote }}
