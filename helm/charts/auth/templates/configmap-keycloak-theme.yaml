          height: 60px;
          filter: drop-shadow(0 0 12px rgba(159, 201, 210, 0.35));
        }
        .brand-name {
          font-family: var(--font);
          font-size: 22px;
          font-weight: 700;
          letter-spacing: normal;
          color: rgba(255, 255, 255, 0.95);
        }

        .card {
          background: var(--mn-surface-1);
          border-radius: 10px;
          box-shadow: 0 4px 24px var(--mn-shadow), 0 1px 4px rgba(0,0,0,0.15);
          width: 100%;
          max-width: 400px;
          overflow: hidden;
          position: relative;
        }
        .card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 3px;
          background: linear-gradient(90deg, var(--mn-primary), var(--mn-teal));
        }

        .card-body {
          padding: 40px 32px 36px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        .icon-wrap {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          background: var(--mn-surface-3);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 20px;
          color: var(--mn-primary);
        }

        .card-title {
          font-family: var(--font);
          font-size: 17px;
          font-weight: 600;
          color: var(--mn-copy);
          margin-bottom: 8px;
        }
        .card-msg {
          font-size: 14px;
          color: var(--mn-dark-grey);
          line-height: 1.6;
          margin-bottom: 0;
        }

        .card-actions {
          margin-top: 26px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          width: 100%;
        }

        .btn {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 42px;
          border-radius: 6px;
          font-family: var(--font);
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          transition: background .15s;
          text-decoration: none;
          border: none;
        }
        .btn-primary {
          background: var(--mn-primary);
          color: #fff;
        }
        .btn-primary:hover { background: var(--mn-primary-mid); }

        .btn-ghost {
          background: none;
          color: var(--mn-primary-mid);
          border: 1px solid var(--mn-border);
        }
        .btn-ghost:hover { background: var(--mn-surface-3); }

        .page-footer {
          margin-top: 24px;
          font-size: 12px;
          color: rgba(159, 201, 210, 0.45);
          font-family: var(--font);
        }
      </style>
    </head>
    <body>

      <div class="brand">
        <img src="${url.resourcesPath}/img/logo.svg" alt="MetrANOVA logo">
        <span class="brand-name">MetrANOVA</span>
      </div>

      <div class="card">
        <div class="card-body">

          <#-- Icon: checkmark for success/info, info circle otherwise -->
          <div class="icon-wrap">
            <#if message?? && message.summary?contains("logged out")>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            <#else>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </#if>
          </div>

          <#-- Title -->
          <div class="card-title">
            <#if message?? && message.summary?contains("logged out")>
              You've been signed out
            <#elseif messageHeader??>
              ${msg("${messageHeader}")}
            <#elseif message??>
              ${message.summary}
            <#else>
              Done
            </#if>
          </div>

          <#-- Body message -->
          <#if message??>
            <#if message.summary?contains("logged out")>
              <p class="card-msg">Your session has ended. Sign in again to continue.</p>
            <#else>
              <p class="card-msg">
                ${message.summary?no_esc}<#if requiredActions??><#list requiredActions>: <strong><#items as reqActionItem>${msg("requiredAction.${reqActionItem}")}<#sep>, </#items></strong></#list></#if>
              </p>
            </#if>
          </#if>

          <#-- Actions / links -->
          <#if !skipLink??>
            <div class="card-actions">
              <#if pageRedirectUri?has_content>
                <a class="btn btn-primary" href="${pageRedirectUri}">${msg("backToApplication")}</a>
              <#elseif actionUri?has_content>
                <a class="btn btn-primary" href="${actionUri}">${msg("proceedWithAction")}</a>
              <#elseif message?? && message.summary?contains("logged out")>
                <a class="btn btn-primary" href="${url.loginUrl!''}">Sign in again</a>
              <#elseif (client.baseUrl)?has_content>
                <a class="btn btn-ghost" href="${client.baseUrl}">${msg("backToApplication")}</a>
              </#if>
            </div>
          </#if>

        </div>
      </div>

      <div class="page-footer">MetrANOVA &mdash; Network Analytics Platform</div>

    </body>
    </html>
