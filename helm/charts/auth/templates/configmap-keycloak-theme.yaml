      </div>

      <div class="card">
        <div class="card-body">

          <div class="signout-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </div>

          <div class="card-title">Sign out?</div>
          <div class="card-sub">You'll be signed out of MetrANOVA and all connected applications.</div>

          <div class="actions">
            <form action="${url.logoutConfirmAction}" method="POST">
              <input type="hidden" name="session_code" value="${logoutConfirm.code}">
              <button class="btn btn-danger" name="confirmLogout" id="kc-logout" type="submit"
                      onclick="this.disabled=true; this.form.submit();">
                Sign out
              </button>
            </form>

            <#if !logoutConfirm.skipLink && (client.baseUrl)?has_content>
              <a class="btn btn-ghost" href="${client.baseUrl}">Stay signed in</a>
            <#else>
              <button class="btn btn-ghost" onclick="history.back()">Stay signed in</button>
            </#if>
          </div>

        </div>
      </div>

      <div class="page-footer">MetrANOVA &mdash; Network Analytics Platform</div>

    </body>
    </html>
  frontchannel-logout.ftl: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex, nofollow">
      <title>Signing out — MetrANOVA</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --mn-primary:      #345F68;
          --mn-primary-dark: #214148;
          --mn-primary-mid:  #4A7F8A;
          --mn-teal:         #45A9BF;
          --mn-surface-1:    #FFFFFF;
          --mn-surface-3:    #EEF2F4;
          --mn-copy:         #252F30;
          --mn-dark-grey:    #4D595D;
          --mn-light-grey:   #A5B3B7;
          --mn-border:       rgba(52, 95, 104, 0.18);
          --mn-shadow:       rgba(0, 0, 0, 0.25);
          --font:            'Neue Haas Unica Pro', Inter, sans-serif;
          --font-body:       Inter, sans-serif;
        }

        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: var(--font-body);
          -webkit-font-smoothing: antialiased;
          background-color: var(--mn-primary-dark);
          background-image:
            linear-gradient(rgba(69, 169, 191, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(69, 169, 191, 0.07) 1px, transparent 1px);
          background-size: 40px 40px;
          padding: 24px;
        }

        .brand {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          margin-bottom: 28px;
        }
        .brand img {
          width: 60px;
          height: 60px;
          filter: drop-shadow(0 0 12px rgba(159, 201, 210, 0.35));
        }
        .brand-name {
          font-family: var(--font);
          font-size: 22px;
          font-weight: 700;
          letter-spacing: normal;
          color: rgba(255, 255, 255, 0.95);
        }

        .card {
          background: var(--mn-surface-1);
          border-radius: 10px;
          box-shadow: 0 4px 24px var(--mn-shadow), 0 1px 4px rgba(0,0,0,0.15);
          width: 100%;
          max-width: 400px;
          overflow: hidden;
          position: relative;
        }
        .card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 3px;
          background: linear-gradient(90deg, var(--mn-primary), var(--mn-teal));
        }

        .card-body {
          padding: 40px 32px 36px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        /* Animated spinner ring */
        .spinner {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 2.5px solid var(--mn-surface-3);
          border-top-color: var(--mn-teal);
          animation: spin 0.8s linear infinite;
          margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-title {
          font-family: var(--font);
          font-size: 17px;
          font-weight: 600;
          color: var(--mn-copy);
          margin-bottom: 8px;
        }
        .card-sub {
          font-size: 13px;
          color: var(--mn-light-grey);
          line-height: 1.55;
        }

        /* Hidden iframes for front-channel logout */
        .fc-iframes { display: none; }

        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          margin-top: 24px;
          padding: 0 24px;
          height: 40px;
          border-radius: 6px;
          font-family: var(--font);
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          text-decoration: none;
          border: none;
          background: var(--mn-primary);
          color: #fff;
          transition: background .15s;
        }
        .btn:hover { background: var(--mn-primary-mid); }

        .page-footer {
          margin-top: 24px;
          font-size: 12px;
          color: rgba(159, 201, 210, 0.45);
          font-family: var(--font);
        }
      </style>
    </head>
    <body>

      <div class="brand">
        <img src="${url.resourcesPath}/img/logo.svg" alt="MetrANOVA logo">
        <span class="brand-name">MetrANOVA</span>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="spinner"></div>
          <div class="card-title">Signing you out&hellip;</div>
          <div class="card-sub">Ending your session across all applications.</div>

          <#if logout?? && logout.logoutRedirectUri?has_content>
            <a class="btn" id="continue" href="${logout.logoutRedirectUri}">Continue</a>
          </#if>
        </div>
      </div>

      <#-- Front-channel logout iframes (hidden, fire-and-forget) -->
      <div class="fc-iframes">
        <#if logout?? && logout.clients??>
          <#list logout.clients as client>
            <iframe src="${client.frontChannelLogoutUrl}" title="${client.name}"></iframe>
          </#list>
        </#if>
      </div>

      <#-- Auto-redirect once iframes have loaded -->
      <#if logout?? && logout.logoutRedirectUri?has_content>
        <script>
          document.addEventListener('readystatechange', function() {
            if (document.readyState === 'complete') {
              window.location.replace('${logout.logoutRedirectUri}');
            }
          });
        </script>
      </#if>

      <div class="page-footer">MetrANOVA &mdash; Network Analytics Platform</div>

    </body>
    </html>
