apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metranova-auth.fullname" . }}-keycloak-theme
  labels:
    {{- include "metranova-auth.labels" . | nindent 4 }}
data:
  theme.properties: |
    parent=base
    import=common/keycloak
  login.ftl: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex, nofollow">
      <title>Sign in — MetrANOVA</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --mn-primary:      #345F68;
          --mn-primary-dark: #214148;
          --mn-primary-mid:  #4A7F8A;
          --mn-teal:         #45A9BF;
          --mn-lt-teal:      #C7DADF;
          --mn-secondary:    #9FC9D2;
          --mn-accent-2:     #F2C641;
          --mn-surface-1:    #FFFFFF;
          --mn-surface-3:    #EEF2F4;
          --mn-copy:         #252F30;
          --mn-dark-grey:    #4D595D;
          --mn-light-grey:   #A5B3B7;
          --mn-error:        #C0392B;
          --mn-error-bg:     #FDECEA;
          --mn-border:       rgba(52, 95, 104, 0.18);
          --mn-border-focus: #45A9BF;
          --mn-shadow:       rgba(0, 0, 0, 0.25);
          --font:            'Neue Haas Unica Pro', Inter, sans-serif;
          --font-body:       Inter, sans-serif;
        }

        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: var(--font-body);
          -webkit-font-smoothing: antialiased;
          background-color: var(--mn-primary-dark);
          background-image:
            linear-gradient(rgba(69, 169, 191, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(69, 169, 191, 0.07) 1px, transparent 1px);
          background-size: 40px 40px;
          padding: 24px;
        }

        .brand {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          margin-bottom: 28px;
        }
        .brand img {
          width: 60px;
          height: 60px;
          filter: drop-shadow(0 0 12px rgba(159, 201, 210, 0.35));
        }
        .brand-name {
          font-family: var(--font);
          font-size: 22px;
          font-weight: 700;
          letter-spacing: normal;
          color: rgba(255, 255, 255, 0.95);
        }

        .card {
          background: var(--mn-surface-1);
          border-radius: 10px;
          box-shadow: 0 4px 24px var(--mn-shadow), 0 1px 4px rgba(0,0,0,0.15);
          width: 100%;
          max-width: 400px;
          overflow: hidden;
          position: relative;
        }
        .card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 3px;
          background: linear-gradient(90deg, var(--mn-primary), var(--mn-teal));
        }

        .card-body {
          padding: 32px 32px 28px;
        }

        .card-title {
          font-family: var(--font);
          font-size: 16px;
          font-weight: 600;
          color: var(--mn-copy);
          margin-bottom: 6px;
        }
        .card-sub {
          font-size: 13px;
          color: var(--mn-light-grey);
          margin-bottom: 24px;
        }

        /* ── Alert / error ─────────────────────── */
        .alert {
          display: flex;
          align-items: flex-start;
          gap: 9px;
          padding: 11px 14px;
          border-radius: 6px;
          font-size: 13px;
          font-weight: 500;
          margin-bottom: 20px;
          line-height: 1.5;
        }
        .alert-error {
          background: var(--mn-error-bg);
          border: 1px solid rgba(192, 57, 43, 0.22);
          color: var(--mn-error);
        }
        .alert-info {
          background: rgba(69, 169, 191, 0.08);
          border: 1px solid rgba(69, 169, 191, 0.25);
          color: var(--mn-primary);
        }
        .alert-warning {
          background: rgba(242, 198, 65, 0.12);
          border: 1px solid rgba(242, 198, 65, 0.35);
          color: #8a6a00;
        }

        /* ── Form fields ───────────────────────── */
        .field {
          margin-bottom: 16px;
        }
        .field label {
          display: block;
          font-family: var(--font);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.10em;
          text-transform: uppercase;
          color: var(--mn-primary-mid);
          margin-bottom: 6px;
        }
        .field input {
          width: 100%;
          height: 40px;
          padding: 0 12px;
          font-family: var(--font-body);
          font-size: 14px;
          color: var(--mn-copy);
          background: var(--mn-surface-3);
          border: 1px solid var(--mn-border);
          border-radius: 6px;
          outline: none;
          transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
          border-color: var(--mn-border-focus);
          box-shadow: 0 0 0 3px rgba(69, 169, 191, 0.15);
          background: #fff;
        }
        .field input.error {
          border-color: var(--mn-error);
        }

        /* ── Remember me ───────────────────────── */
        .remember {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 20px;
        }
        .remember input[type="checkbox"] {
          width: 15px;
          height: 15px;
          accent-color: var(--mn-primary);
          cursor: pointer;
        }
        .remember label {
          font-size: 13px;
          color: var(--mn-dark-grey);
          cursor: pointer;
        }

        /* ── Buttons ───────────────────────────── */
        .btn {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 100%;
          height: 42px;
          border-radius: 6px;
          font-family: var(--font);
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          transition: background .15s, opacity .15s;
          text-decoration: none;
          border: none;
        }
        .btn-primary {
          background: var(--mn-primary);
          color: #fff;
        }
        .btn-primary:hover { background: var(--mn-primary-mid); }

        .btn-idp {
          background: var(--mn-surface-3);
          color: var(--mn-copy);
          border: 1px solid var(--mn-border);
          font-weight: 500;
        }
        .btn-idp:hover { background: #e4eaec; }

        /* ── Divider ───────────────────────────── */
        .divider {
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 20px 0;
        }
        .divider::before, .divider::after {
          content: '';
          flex: 1;
          height: 1px;
          background: var(--mn-border);
        }
        .divider span {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--mn-light-grey);
          white-space: nowrap;
        }

        /* ── Footer ────────────────────────────── */
        .card-footer {
          padding: 14px 32px;
          border-top: 1px solid var(--mn-border);
          background: var(--mn-surface-3);
          display: flex;
          justify-content: flex-end;
          gap: 16px;
        }
        .card-footer a {
          font-size: 12px;
          color: var(--mn-primary-mid);
          text-decoration: none;
        }
        .card-footer a:hover { text-decoration: underline; }

        .page-footer {
          margin-top: 24px;
          font-size: 12px;
          color: rgba(159, 201, 210, 0.45);
          font-family: var(--font);
        }
      </style>
    </head>
    <body>

      <div class="brand">
        <img src="${url.resourcesPath}/img/logo.svg" alt="MetrANOVA logo">
        <span class="brand-name">MetrANOVA</span>
      </div>

      <div class="card">
        <div class="card-body">

          <div class="card-title">Sign in</div>
          <div class="card-sub">Use your organization credentials to continue.</div>

          <#if message?? && message.type != 'success'>
            <div class="alert alert-${message.type}">
              ${message.summary?no_esc}
            </div>
          </#if>

          <#-- Social / IdP providers (e.g. Globus) -->
          <#if social.providers?? && social.providers?size gt 0>
            <#list social.providers as p>
              <a class="btn btn-idp" href="${p.loginUrl}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
                </svg>
                Sign in with ${p.displayName}
              </a>
            </#list>
            <#if login?? && realm.password>
              <div class="divider"><span>or</span></div>
            </#if>
          </#if>

          <#-- Username / password form -->
          <#if realm.password>
            <form action="${url.loginAction}" method="post">
              <input type="hidden" id="id-hidden-input" name="credentialId"
                <#if auth?? && auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>

              <div class="field">
                <label for="username">
                  <#if !realm.loginWithEmailAllowed>Username
                  <#elseif !realm.registrationEmailAsUsername>Username or email
                  <#else>Email</#if>
                </label>
                <input
                  id="username"
                  name="username"
                  type="text"
                  value="${login.username!''}"
                  autocomplete="username"
                  autofocus
                  <#if usernameEditDisabled??>disabled</#if>
                  class="<#if messagesPerField.existsError('username','password')>error</#if>"
                >
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  class="<#if messagesPerField.existsError('username','password')>error</#if>"
                >
              </div>

              <#if realm.rememberMe && !usernameEditDisabled??>
                <div class="remember">
                  <input type="checkbox" id="rememberMe" name="rememberMe"
                    <#if login.rememberMe??>checked</#if>>
                  <label for="rememberMe">Stay signed in</label>
                </div>
              </#if>

              <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
          </#if>

        </div>

        <#if realm.resetPasswordAllowed || realm.registrationAllowed>
          <div class="card-footer">
            <#if realm.resetPasswordAllowed>
              <a href="${url.loginResetCredentialsUrl}">Forgot password?</a>
            </#if>
            <#if realm.registrationAllowed>
              <a href="${url.registrationUrl}">Create account</a>
            </#if>
          </div>
        </#if>
      </div>

      <div class="page-footer">MetrANOVA &mdash; Network Analytics Platform</div>

    </body>
    </html>
  info.ftl: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex, nofollow">
      <title>MetrANOVA</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --mn-primary:      #345F68;
          --mn-primary-dark: #214148;
          --mn-primary-mid:  #4A7F8A;
          --mn-teal:         #45A9BF;
          --mn-surface-1:    #FFFFFF;
          --mn-surface-3:    #EEF2F4;
          --mn-copy:         #252F30;
          --mn-dark-grey:    #4D595D;
          --mn-light-grey:   #A5B3B7;
          --mn-border:       rgba(52, 95, 104, 0.18);
          --mn-shadow:       rgba(0, 0, 0, 0.25);
