apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metranova-auth.fullname" . }}-keycloak-ldap-sync
  labels:
    {{- include "metranova-auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-ldap-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "metranova-auth.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak-ldap-sync
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "metranova-auth.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-ldap-sync
    spec:
      {{- include "metranova-auth.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "metranova-auth.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: keycloak-ldap-sync
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.keycloakLdapSync.image.repository }}:{{ .Values.keycloakLdapSync.image.tag }}"
          imagePullPolicy: {{ .Values.keycloakLdapSync.image.pullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "metranova-auth.fullname" . }}-keycloak:8080"
            - name: KEYCLOAK_REALM
              value: {{ .Values.realm | quote }}
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "metranova-auth.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "metranova-auth.fullname" . }}-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: LDAP_HOST
              value: {{ include "metranova-auth.fullname" . }}-openldap
            - name: LDAP_PORT
              value: "389"
            - name: LDAP_BASE_DN
              value: {{ include "metranova-auth.ldapBaseDN" . | quote }}
            - name: LDAP_BIND_DN
              value: "cn=admin,{{ include "metranova-auth.ldapBaseDN" . }}"
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "metranova-auth.fullname" . }}-secrets
                  key: LDAP_ADMIN_PASSWORD
            - name: SYNC_INTERVAL
              value: {{ .Values.keycloakLdapSync.syncInterval | default 30 | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.keycloakLdapSync.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
