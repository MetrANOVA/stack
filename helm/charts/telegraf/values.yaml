replicaCount: 1

image:
  repository: telegraf
  tag: "1.37-alpine"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

service:
  enabled: true
  type: ClusterIP
  name: ""  # defaults to release-name-telegraf if empty

inputs:
  # On by default. Ships with agents = [] so it polls nothing until configured.
  snmp:
    enabled: true
  netflow:
    enabled: false

outputs:
  # Default: Kafka over TLS as the Strimzi-provisioned pipeline user.
  # Connection details come from the kafka: block below.
  kafka:
    enabled: true
    dataFormat: json
    brokers: []          # empty = derive from kafka.clusterName/namespace/port
    tls:
      enabled: true
    topics:              # one [[outputs.kafka]] block per entry
      - topic: metranova_snmp
        namepass: ["snmp_*"]

  # Raw TOML appended verbatim. Set kafka.enabled=false and use this to
  # replace the default output entirely.
  extraConfig: ""

kafka:
  namespace: ""
  port: 9093
  userName: pipeline-user
  certSecret: ""
  clusterCaSecret: ""
  clusterCaCert: ca.crt
  userCert: user.crt
  userKey: user.key
