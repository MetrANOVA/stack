[agent]
  collection_jitter = "0s"
  debug = false
  flush_interval = "10s"
  flush_jitter = "0s"
  hostname = "$HOSTNAME"
  interval = "10s"
  logfile = ""
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true
  precision = ""
  quiet = false
  round_interval = true

[[outputs.kafka]]
  brokers = ["metranova-kafka-kafka-bootstrap:9093"]
  enable_tls = true
  data_format = "json"
  tls_ca = "/etc/telegraf/cluster-ca/ca.crt"
  tls_cert = "/etc/telegraf/certs/user.crt"
  tls_key = "/etc/telegraf/certs/user.key"
