---
{{- $clusterName := include "kafka.clusterName" . }}
{{- if .Values.customNodePools }}
{{- range $poolName, $poolConfig := .Values.customNodePools }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $clusterName }}-{{ $poolName }}
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  replicas: {{ $poolConfig.replicas }}
  roles:
    {{- toYaml $poolConfig.roles | nindent 4 }}
  storage:
    {{- toYaml $poolConfig.storage | nindent 4 }}
  {{- if $poolConfig.template }}
  template:
    {{- toYaml $poolConfig.template | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- else }}
{{- $kraftStorageClass := .Values.kraft.storage.class | default .Values.global.storageClassName }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $clusterName }}-kraft-controllers
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  replicas: {{ .Values.kraft.replicas }}
  roles:
    - controller
  {{- with .Values.kraft.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if or .Values.kraft.affinity .Values.kraft.tolerations .Values.kraft.topologySpreadConstraints }}
  template:
    pod:
      {{- with .Values.kraft.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kraft.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kraft.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  storage:
    type: persistent-claim
    size: {{ .Values.kraft.storage.size }}
    {{- if $kraftStorageClass }}
    class: {{ $kraftStorageClass }}
    {{- end }}
    deleteClaim: false
---
{{- $kafkaStorageClass := .Values.kafka.storage.class | default .Values.global.storageClassName }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $clusterName }}-brokers
  labels:
    strimzi.io/cluster: {{ $clusterName }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - broker
  {{- with .Values.kafka.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if or .Values.kafka.affinity .Values.kafka.tolerations .Values.kafka.topologySpreadConstraints }}
  template:
    pod:
      {{- with .Values.kafka.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafka.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kafka.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  storage:
    type: persistent-claim
    size: {{ .Values.kafka.storage.size }}
    {{- if $kafkaStorageClass }}
    class: {{ $kafkaStorageClass }}
    {{- end }}
    deleteClaim: false
---
{{- end }}
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ $clusterName }}
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    {{- $kafkaImage := get .Values.kafka "image" }}
    {{- if $kafkaImage }}
    {{- $kafkaImageRepository := get $kafkaImage "repository" }}
    {{- $kafkaImageTag := get $kafkaImage "tag" }}
    {{- if and $kafkaImageRepository $kafkaImageTag }}
    image: {{ printf "%s:%s" $kafkaImageRepository $kafkaImageTag | quote }}
    {{- else if $kafkaImageRepository }}
    image: {{ $kafkaImageRepository | quote }}
    {{- end }}
    {{- end }}
    authorization:
      type: simple
      superUsers:
        - CN={{ $clusterName }}-entity-topic-operator
        - CN={{ $clusterName }}-entity-user-operator
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: scram
        port: 9094
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    config:
      {{- if .Values.customKafkaConfig }}
      {{- toYaml .Values.customKafkaConfig | nindent 6 }}
      {{- else }}
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      {{- end }}
  entityOperator:
    topicOperator:
      reconciliationIntervalMs: 120000
      {{- $topicOperatorImage := get .Values.entityOperator.topicOperator "image" }}
      {{- if $topicOperatorImage }}
      {{- $topicOperatorImageRepository := get $topicOperatorImage "repository" }}
      {{- $topicOperatorImageTag := get $topicOperatorImage "tag" }}
      {{- if and $topicOperatorImageRepository $topicOperatorImageTag }}
      image: {{ printf "%s:%s" $topicOperatorImageRepository $topicOperatorImageTag | quote }}
      {{- else if $topicOperatorImageRepository }}
      image: {{ $topicOperatorImageRepository | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.entityOperator.topicOperator.resources }}
      resources:
        {{- toYaml .Values.entityOperator.topicOperator.resources | nindent 8 }}
      {{- end }}
      {{- if or .Values.entityOperator.topicOperator.affinity .Values.entityOperator.topicOperator.tolerations .Values.entityOperator.topicOperator.topologySpreadConstraints }}
      template:
        pod:
          {{- if .Values.entityOperator.topicOperator.affinity }}
          affinity:
            {{- toYaml .Values.entityOperator.topicOperator.affinity | nindent 12 }}
          {{- end }}
          {{- if .Values.entityOperator.topicOperator.tolerations }}
          tolerations:
            {{- toYaml .Values.entityOperator.topicOperator.tolerations | nindent 12 }}
          {{- end }}
          {{- if .Values.entityOperator.topicOperator.topologySpreadConstraints }}
          topologySpreadConstraints:
            {{- toYaml .Values.entityOperator.topicOperator.topologySpreadConstraints | nindent 12 }}
          {{- end }}
      {{- end }}
    userOperator:
      reconciliationIntervalMs: 120000
      {{- $userOperatorImage := get .Values.entityOperator.userOperator "image" }}
      {{- if $userOperatorImage }}
      {{- $userOperatorImageRepository := get $userOperatorImage "repository" }}
      {{- $userOperatorImageTag := get $userOperatorImage "tag" }}
      {{- if and $userOperatorImageRepository $userOperatorImageTag }}
      image: {{ printf "%s:%s" $userOperatorImageRepository $userOperatorImageTag | quote }}
      {{- else if $userOperatorImageRepository }}
      image: {{ $userOperatorImageRepository | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.entityOperator.userOperator.resources }}
      resources:
        {{- toYaml .Values.entityOperator.userOperator.resources | nindent 8 }}
      {{- end }}
      {{- if or .Values.entityOperator.userOperator.affinity .Values.entityOperator.userOperator.tolerations .Values.entityOperator.userOperator.topologySpreadConstraints }}
      template:
        pod:
          {{- if .Values.entityOperator.userOperator.affinity }}
          affinity:
            {{- toYaml .Values.entityOperator.userOperator.affinity | nindent 12 }}
          {{- end }}
          {{- if .Values.entityOperator.userOperator.tolerations }}
          tolerations:
            {{- toYaml .Values.entityOperator.userOperator.tolerations | nindent 12 }}
          {{- end }}
          {{- if .Values.entityOperator.userOperator.topologySpreadConstraints }}
          topologySpreadConstraints:
            {{- toYaml .Values.entityOperator.userOperator.topologySpreadConstraints | nindent 12 }}
          {{- end }}
      {{- end }}
