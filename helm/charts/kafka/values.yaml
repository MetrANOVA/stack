global:
  storageClassName: ""

cluster:
  name: ""

# Override the default kraft-controllers + brokers node pools with custom pools.
# Each key becomes the pool name suffix; values must include replicas, roles, and storage.
# Example:
#   customNodePools:
#     controllers:
#       replicas: 3
#       roles: [controller]
#       storage:
#         type: persistent-claim
#         size: 5Gi
#         class: sc-rbd-multi-cluster
#         deleteClaim: false
#     brokers:
#       replicas: 3
#       roles: [broker]
#       storage:
#         type: persistent-claim
#         size: 20Gi
#         class: sc-rbd-multi-cluster
#         deleteClaim: false
customNodePools: {}

# Override the default Kafka broker config. When set, replaces the built-in defaults entirely.
# Example:
#   customKafkaConfig:
#     offsets.topic.replication.factor: 3
#     min.insync.replicas: 2
customKafkaConfig: {}

kafka:
  version: 4.3.0
  image:
    # Optional custom image repository. Leave empty to use Strimzi defaults.
    repository: ""
    # Optional custom image tag. If empty and repository is set, repository is used as-is.
    tag: ""
  replicas: 3
  replicationFactor: 3
  minIsr: 2
  resources: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  storage:
    size: 20Gi
    class: sc-rbd-multi-cluster

kraft:
  replicas: 3
  resources: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  storage:
    size: 5Gi
    class: sc-rbd-multi-cluster

entityOperator:
  topicOperator:
    image:
      # Optional custom image repository. Leave empty to use Strimzi defaults.
      repository: ""
      # Optional custom image tag. If empty and repository is set, repository is used as-is.
      tag: ""
    resources: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  userOperator:
    image:
      # Optional custom image repository. Leave empty to use Strimzi defaults.
      repository: ""
      # Optional custom image tag. If empty and repository is set, repository is used as-is.
      tag: ""
    resources: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []

topics:
  sflow:
    partitions: 3
    replicas: 2
    retentionMs: 604800000
    retentionBytes: 2147483648
    segmentBytes: 268435456
  netflow:
    partitions: 5
    replicas: 2
    retentionMs: 604800000
    retentionBytes: 2147483648
    segmentBytes: 268435456
  snmp:
    partitions: 3
    replicas: 2
    retentionMs: 604800000
    retentionBytes: 2147483648
    segmentBytes: 268435456
