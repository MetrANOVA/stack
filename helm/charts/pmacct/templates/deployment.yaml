{{- if .Values.nfacctd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nfacctd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nfacctd
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nfacctd
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.nfacctd.port }}
      targetPort: {{ .Values.nfacctd.port }}
      protocol: UDP
      name: netflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nfacctd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nfacctd
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nfacctd
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfacctd
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nfacctd
          image: "{{ .Values.image.repository }}/nfacctd:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.nfacctd.port }}
              protocol: UDP
          volumeMounts:
            - name: nfacctd-config
              mountPath: /etc/pmacct/nfacctd.conf
              subPath: nfacctd.conf
            - name: nfacctd-config
              mountPath: /etc/pmacct/kafka.csv
              subPath: kafka.csv
            - name: nfacctd-config
              mountPath: /etc/pmacct/pretag.map
              subPath: pretag.map
            - name: kafka-certs
              mountPath: /etc/pmacct/certs
            - name: kafka-cluster-ca
              mountPath: /etc/pmacct/cluster-ca
      volumes:
        - name: nfacctd-config
          configMap:
            name: {{ .Release.Name }}-nfacctd-config
        - name: kafka-certs
          secret:
            secretName: {{ include "pmacct.kafkaUserSecretName" . }}
            optional: true
        - name: kafka-cluster-ca
          secret:
            secretName: {{ include "pmacct.kafkaClusterCaSecretName" . }}
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
