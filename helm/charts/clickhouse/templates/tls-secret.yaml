{{- if and .Values.config.tls.enabled .Values.config.tls.autoGenerate }}
{{- $secretName := .Values.config.tls.cert_name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- if and $existing (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") }}
{{- $tlsCrt = index $existing.data "tls.crt" }}
{{- $tlsKey = index $existing.data "tls.key" }}
{{- else }}
{{- $defaultCN := printf "clickhouse-ch-cluster.%s.svc" .Release.Namespace }}
{{- $cn := .Values.config.tls.commonName | default $defaultCN }}
{{- $defaultAltNames := .Values.config.domains }}
{{- $clickSub := .Values.global.clickhouseSubdomain | default "clickhouse" -}}
{{- if .Values.global.ingressHost }}
{{- $defaultAltNames = list .Values.global.ingressHost }}
{{- else if .Values.global.ingressDomain }}
{{- $defaultAltNames = list .Values.global.ingressDomain }}
{{- else if .Values.global.baseDomain }}
{{- $defaultAltNames = list (printf "%s.%s" $clickSub .Values.global.baseDomain) }}
{{- end }}
{{- $altNames := .Values.config.tls.altNames | default $defaultAltNames }}
{{- $cert := genSelfSignedCert $cn nil $altNames (.Values.config.tls.validDays | int) }}
{{- $tlsCrt = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
{{- end }}
