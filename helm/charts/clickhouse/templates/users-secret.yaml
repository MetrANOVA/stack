{{- if .Values.config.ch.userSecret.autoCreate }}
{{- $secretName := .Values.config.ch.userSecret.name | default "clickhouse-users" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
{{- $keys := .Values.config.ch.userSecret.keys }}
{{- $seed := .Values.config.ch.userSecret.passwordSeed | default (printf "%s|%s|clickhouse-users" .Release.Namespace .Release.Name) }}
{{- $adminPassword := .Values.config.ch.userSecret.passwords.admin | default (printf "%s|admin" $seed | sha256sum | trunc 32) }}
{{- $readonlyPassword := .Values.config.ch.userSecret.passwords.readonly | default (printf "%s|readonly" $seed | sha256sum | trunc 32) }}
{{- $backupPassword := .Values.config.ch.userSecret.passwords.backup | default (printf "%s|backup" $seed | sha256sum | trunc 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ $keys.admin | default "admin-password" }}: {{ $adminPassword | quote }}
  {{ $keys.readonly | default "readonly-password" }}: {{ $readonlyPassword | quote }}
  {{ $keys.backup | default "backup-password" }}: {{ $backupPassword | quote }}
{{- end }}
{{- end }}
