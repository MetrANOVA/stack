{{- if not .Values.configFiles.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metranova-flow-pipeline.fullname" . }}-config
  labels:
    {{- include "metranova-flow-pipeline.labels" . | nindent 4 }}
data:
  {{- if .Values.configFiles.metaInterface }}
  meta_interface.yml: |
    {{- .Values.configFiles.metaInterface | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.metaDevice }}
  meta_device.yml: |
    {{- .Values.configFiles.metaDevice | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.metaCircuit }}
  meta_circuit.yml: |
    {{- .Values.configFiles.metaCircuit | nindent 4 }}
  {{- end }}
  {{- if or .Values.configFiles.metaApplication (.Files.Get "files/meta_application.yml") }}
  meta_application.yml: |
    {{- .Values.configFiles.metaApplication | default (.Files.Get "files/meta_application.yml") | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.caidaAsOrg2Info }}
  caida_as_org2_info.jsonl: |
    {{- .Values.configFiles.caidaAsOrg2Info | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.caidaPeeringDb }}
  caida_peeringdb.json: |
    {{- .Values.configFiles.caidaPeeringDb | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.caidaCustomOrgAdditions }}
  custom_org_additions.yml: |
    {{- .Values.configFiles.caidaCustomOrgAdditions | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.caidaCustomAsAdditions }}
  caida_custom_as_additions.yml: |
    {{- .Values.configFiles.caidaCustomAsAdditions | nindent 4 }}
  {{- end }}
  {{- if .Values.configFiles.ipgeoCustomIpFile }}
  ipgeo_custom_ip_file: |
    {{- .Values.configFiles.ipgeoCustomIpFile | nindent 4 }}
  {{- end }}
{{- end }}
