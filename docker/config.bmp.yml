
stacks:
  - type: bmp
    collectors:
      - type: pmbmpd
        enabled: true
    pipeline:
      enabled: true
      shared_services:
        - cache_ip_trie
        - metadata_ip_geo
        - metadata_caida_org_as

message_bus:
  type: kafka
  enabled: true

datastore:
  type: clickhouse
  enabled: true

dashboard:
  type: grafana
  enabled: true

proxy:
  type: envoy
  enabled: true
