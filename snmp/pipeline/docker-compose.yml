services:

  data_snmp:
    image: ghcr.io/metranova/pipeline:andy-telegraf-cleanup
    env_file:
      - conf/envs/base.env
      - conf/envs/data_snmp.env
    volumes:
      - ./caches:/app/caches:ro
      - ./conf:/app/conf:ro
    restart: always
    deploy:
      mode: replicated
      replicas: ${PIPELINE_REPLICAS:-1}