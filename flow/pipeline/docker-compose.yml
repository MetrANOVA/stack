services:
  pipeline-init:
    image: python:3.11-slim
    container_name: pipeline-init
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        pip install --no-cache-dir jinja2 &&
        python /scripts/render_configs.py
    volumes:
      - ./conf:/app/conf
      - ./scripts:/scripts:ro
    restart: "no"

  data_flow:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/data_flow.env
    volumes:
      - ./caches:/app/caches:ro
      - ./conf:/app/conf:ro
      - ./conf/kafka/ca.crt:/etc/kafka/ca.crt:ro
    restart: always
    deploy:
      mode: replicated
      replicas: ${PIPELINE_REPLICAS:-1}
  
  metadata_caida_org_as:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/metadata_caida_org_as.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    restart: always
  
  metadata_file_export:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/metadata_file_export.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    restart: always
  
  metadata_ip_geo:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/metadata_ip_geo.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    restart: always
  
  metadata_scireg:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/metadata_scireg.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    restart: always

  metadata_cric:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/metadata_cric.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    profiles: ["lhc"]
    restart: always

  cache_ip_trie:
    image: ghcr.io/metranova/pipeline:latest
    env_file:
      - conf/envs/base.env
      - conf/envs/cache_ip_trie.env
    volumes:
      - ./caches:/app/caches:rw
      - ./conf:/app/conf:ro
    restart: always