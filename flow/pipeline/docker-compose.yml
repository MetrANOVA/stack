services:
  flow-pipeline-init:
    image: python:3.11-slim
    container_name: flow-pipeline-init
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        pip install --no-cache-dir jinja2 &&
        python /scripts/render_configs.py
    volumes:
      - ./conf:/app/conf
      - ./scripts:/scripts:ro
    restart: "no"

  data_flow:
    image: ghcr.io/metranova/pipeline:latest
    depends_on:
      flow-pipeline-init:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    env_file:
      - conf/envs/base.env
      - conf/envs/data_flow.env
    volumes:
      - ../../shared/pipeline/caches:/app/caches:ro
      - ./conf:/app/conf:ro
      - ./conf/kafka/ca.crt:/etc/kafka/ca.crt:ro
    restart: always
    deploy:
      mode: replicated
      replicas: ${PIPELINE_REPLICAS:-1}
