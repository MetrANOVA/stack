services:
  nfacctd-init:
    image: python:3.11-slim
    container_name: nfacctd-init
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        pip install --no-cache-dir jinja2 &&
        python /scripts/render_configs.py
    volumes:
      - ./conf:/etc/pmacct
      - ./scripts:/scripts:ro
    restart: "no"

  nfacctd:
    image: pmacct/nfacctd:v1.7.9
    restart: always
    depends_on:
      nfacctd-init:
        condition: service_completed_successfully
    ports:
      - "9996:9996/udp"
    volumes:
      - ./conf:/etc/pmacct:ro
      - ./conf/kafka/ca.crt:/etc/pmacct_certificates/ca.crt:ro