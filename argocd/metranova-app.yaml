apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metranova
  namespace: argocd
spec:
  project: default
  destination:
    namespace: metranova
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/MetrANOVA/stack.git
    targetRevision: add-auth-system
    path: helm/metranova
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: global.storageClassName
          value: standard-rwo
        - name: clickhouse.config.chk.resources.storageClassName
          value: standard-rwo
        - name: clickhouse.config.ch.resources.storageClassName
          value: standard-rwo
        # Dev cluster overrides — production values are too large for 2CPU/6Gi nodes
        - name: clickhouse.config.ch.resources.replicasCount
          value: "1"
        - name: clickhouse.config.ch.resources.shardCount
          value: "1"
        - name: clickhouse.config.ch.resources.requests.memory
          value: 3Gi
        - name: clickhouse.config.ch.resources.limits.memory
          value: 4Gi
        - name: clickhouse.config.ch.resources.requests.cpu
          value: "100m"
        - name: clickhouse.config.ch.resources.limits.cpu
          value: "1500m"
        - name: clickhouse.config.chk.resources.replicasCount
          value: "1"
        - name: clickhouse.config.chk.resources.requests.memory
          value: 512Mi
        - name: clickhouse.config.chk.resources.limits.memory
          value: 1Gi
        - name: clickhouse.config.chk.resources.requests.cpu
          value: "250m"
        - name: clickhouse.config.chk.resources.limits.cpu
          value: "500m"
        # Dev cluster: reduce pipeline CPU requests so pending pods can schedule
        - name: snmpPipeline.dataSnmp.resources.requests.cpu
          value: "50m"
        - name: snmpPipeline.dataSnmp.resources.limits.cpu
          value: "500m"
        - name: snmpPipeline.metadataCaidaOrgAs.resources.requests.cpu
          value: "50m"
        - name: snmpPipeline.metadataCaidaOrgAs.resources.limits.cpu
          value: "250m"
        - name: flowPipeline.cacheIpTrie.resources.requests.cpu
          value: "50m"
        - name: flowPipeline.cacheIpTrie.resources.limits.cpu
          value: "500m"
        - name: flowPipeline.dataFlow.resources.requests.cpu
          value: "50m"
        - name: flowPipeline.dataFlow.resources.limits.cpu
          value: "1000m"
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
