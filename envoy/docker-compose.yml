services:
  # Obtains a Let's Encrypt certificate via HTTP-01 standalone challenge.
  # Only run by build.py when proxy.letsencrypt.enabled is true.
  certbot-init:
    image: certbot/certbot:latest
    container_name: certbot-init
    ports:
      - "80:80"
    env_file:
      - ./conf/envoy.env
    volumes:
      - certbot-data:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec certbot certonly \
          --standalone \
          --non-interactive \
          --agree-tos \
          --register-unsafely-without-email \
          --keep-until-expiring \
          -d "$ENVOY_LETSENCRYPT_HOSTNAME"
    restart: "no"

  # Copies Let's Encrypt certs into the shared envoy-data volume.
  # Only run by build.py when proxy.letsencrypt.enabled is true.
  envoy-letsencrypt:
    image: envoyproxy/envoy:v1.33-latest
    container_name: envoy-letsencrypt
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc", "/scripts/install-letsencrypt-certs.sh"]
    env_file:
      - ./conf/envoy.env
    environment:
      ENVOY_CONF_FILE: /config/envoy.env
    volumes:
      - envoy-data:/srv/envoy
      - certbot-data:/etc/letsencrypt:ro
      - ./conf:/config:ro
      - ./scripts:/scripts:ro
    restart: "no"

  envoy-certs:
    image: envoyproxy/envoy:v1.33-latest
    container_name: envoy-certs
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc", "/scripts/generate-certs.sh"]
    env_file:
      - ./conf/envoy.env
    volumes:
      - envoy-data:/srv/envoy
      - ./scripts:/scripts:ro
    restart: "no"

  envoy-config:
    image: python:3-slim
    container_name: envoy-config
    depends_on:
      envoy-certs:
        condition: service_completed_successfully
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        pip install --no-cache-dir jinja2 --quiet &&
        /scripts/render-config.sh
    env_file:
      - ./conf/envoy.env
    environment:
      ENVOY_CONF_FILE: /config/envoy.env
    volumes:
      - envoy-data:/srv/envoy
      - ./conf:/config:ro
      - ./scripts:/scripts:ro
      - ./templates:/app/templates:ro
    restart: "no"

  envoy:
    image: envoyproxy/envoy:v1.33-latest
    container_name: envoy
    depends_on:
      envoy-certs:
        condition: service_completed_successfully
      envoy-config:
        condition: service_completed_successfully
    ports:
      - "${ENVOY_HTTPS_PORT:-443}:${ENVOY_HTTPS_PORT:-443}"
    volumes:
      - envoy-data:/srv/envoy
      - ./conf/clickhouse:/srv/clickhouse:ro
    command: ["envoy", "-c", "/srv/envoy/envoy.yaml"]
    restart: unless-stopped

volumes:
  envoy-data:
  certbot-data:
