apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: metranova-clickhouse
    jsonData:
      host: grafana-ch-proxy
      port: 8001
      protocol: http
      secure: false
      defaultDatabase: metranova
      forwardGrafanaHeaders: true
    isDefault: true
    editable: false

