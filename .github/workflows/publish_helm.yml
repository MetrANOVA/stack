name: Release Helm Charts

##
# Controls when the workflow will run
on:
  push:
    branches:
      - main
      # match version branches like 1.0.x, 2.1.x, etc.
      - '*.*.*'
  # Allows you to run this workflow manually from the Actions 
  workflow_dispatch:

##
# The jobs to run that wil publish helm charts
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Detect release branch pattern
        id: branch_gate
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^[0-9]+\.[0-9]+\..+$ ]]; then
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

      # Ensure Chart.yaml version matches branch name for non-main branches
      - name: Ensure Chart Version Matches Branch
        id: version_check
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch == 'true'
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          CHANGED=false

          CHART_FILES=(./helm/metranova/Chart.yaml ./helm/charts/*/Chart.yaml)
          
          # Process all chart definitions in the repository layout.
          for CHART_FILE in "${CHART_FILES[@]}"; do
            if [ -f "$CHART_FILE" ]; then
              CURRENT_VERSION=$(yq eval '.version' "$CHART_FILE")
              
              if [ "$CURRENT_VERSION" != "$BRANCH_NAME" ]; then
                echo "Version mismatch in $CHART_FILE: Chart has '$CURRENT_VERSION' but branch is '$BRANCH_NAME'"
                echo "Updating $CHART_FILE to version $BRANCH_NAME"
                yq eval -i ".version = \"$BRANCH_NAME\"" "$CHART_FILE"
                git add "$CHART_FILE"
                CHANGED=true
              else
                echo "Version in $CHART_FILE already matches branch name: $CURRENT_VERSION"
              fi
            fi
          done
          
          if [ "$CHANGED" = true ]; then
            git commit -m "chore: update chart versions to $BRANCH_NAME"
            git push
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Versions updated and committed. Stopping workflow - new run will be triggered."
          else
            echo "All chart versions already match branch name"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      # Update Chart.yaml to append -beta to version if not on main
      - name: Update Chart Version for Pre-Releases
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch == 'true' && steps.version_check.outputs.version_changed != 'true'
        run: |
          CHART_FILES=(./helm/metranova/Chart.yaml ./helm/charts/*/Chart.yaml)

          for CHART_FILE in "${CHART_FILES[@]}"; do
            if [ -f "$CHART_FILE" ]; then
              echo "Updating chart version in $CHART_FILE"
              yq eval -i ".version += \"-beta.${GITHUB_RUN_NUMBER}\"" "$CHART_FILE"
            fi
          done

      - name: Skip version mutation on non-release branches
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch != 'true'
        run: |
          echo "Branch '${{ github.ref_name }}' is not a release-style branch."
          echo "Skipping chart version mutation steps."

      - name: Prepare release chart tree
        if: steps.version_check.outputs.version_changed != 'true'
        run: |
          rm -rf .cr-release-charts
          mkdir -p .cr-release-charts/charts

          # Charts to publish (one level under .cr-release-charts)
          cp -R helm/charts/* .cr-release-charts/
          cp -R helm/metranova .cr-release-charts/

          # Keep local dependency paths in helm/metranova/Chart.yaml valid
          # (file://../charts/<name>) during packaging.
          cp -R helm/charts/* .cr-release-charts/charts/

      - name: Run chart-releaser
        if: steps.version_check.outputs.version_changed != 'true'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Use prepared chart tree to include both component charts and umbrella chart.
          charts_dir: ./.cr-release-charts
          # if on main, don;t overwrite existing, mark as latest.
          # If on version branch, always publish so that we get new charts as we merge in changes pre-release
          skip_existing: ${{ github.ref_name == 'main' }}
          mark_as_latest: ${{ github.ref_name == 'main' }}
