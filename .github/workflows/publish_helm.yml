name: Release Helm Charts

##
# Controls when the workflow will run
on:
  push:
    branches:
      - main
      # match version branches like 1.0.x, 2.1.x, etc.
      - '*.*.*'
  # Allows you to run this workflow manually from the Actions 
  workflow_dispatch:

##
# The jobs to run that wil publish helm charts
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Detect release branch pattern
        id: branch_gate
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^[0-9]+\.[0-9]+\..+$ ]]; then
            echo "is_release_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_branch=false" >> "$GITHUB_OUTPUT"
          fi

      # Ensure Chart.yaml version matches branch name for non-main branches
      - name: Ensure Chart Version Matches Branch
        id: version_check
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch == 'true' && github.actor != 'github-actions[bot]'
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          CHANGED=false

          CHART_FILES=(./helm/metranova/Chart.yaml ./helm/charts/*/Chart.yaml)
          
          # Process all chart definitions in the repository layout.
          for CHART_FILE in "${CHART_FILES[@]}"; do
            if [ -f "$CHART_FILE" ]; then
              CURRENT_VERSION=$(yq eval '.version' "$CHART_FILE")

              # Allow prerelease suffixes; compare only base semver to branch.
              BASE_VERSION="${CURRENT_VERSION%%-beta*}"

              if [ "$BASE_VERSION" != "$BRANCH_NAME" ]; then
                echo "Version mismatch in $CHART_FILE: Chart has '$CURRENT_VERSION' (base '$BASE_VERSION') but branch is '$BRANCH_NAME'"
                echo "Updating $CHART_FILE to version $BRANCH_NAME"
                yq eval -i ".version = \"$BRANCH_NAME\"" "$CHART_FILE"
                git add "$CHART_FILE"
                CHANGED=true
              else
                echo "Version in $CHART_FILE already matches branch base: $CURRENT_VERSION"
              fi
            fi
          done
          
          if [ "$CHANGED" = true ]; then
            # Keep umbrella local dependency versions aligned with branch version.
            if [ -f ./helm/metranova/Chart.yaml ]; then
              BRANCH_VERSION="$BRANCH_NAME"
              yq eval -i '(.dependencies[] | select(.repository | startswith("file://../charts/")) | .version) = strenv(BRANCH_VERSION)' ./helm/metranova/Chart.yaml
              git add ./helm/metranova/Chart.yaml
            fi

            git commit -m "chore: update chart versions to $BRANCH_NAME"
            git push
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Versions updated and committed. Stopping workflow - new run will be triggered."
          else
            echo "All chart versions already match branch name"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      # Update Chart.yaml to append -beta to version if not on main
      - name: Update Chart Version for Pre-Releases
        id: prerelease_version
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch == 'true' && steps.version_check.outputs.version_changed != 'true' && github.actor != 'github-actions[bot]'
        run: |
          CHANGED=false
          CHART_FILES=(./helm/metranova/Chart.yaml ./helm/charts/*/Chart.yaml)

          for CHART_FILE in "${CHART_FILES[@]}"; do
            if [ -f "$CHART_FILE" ]; then
              CURRENT_VERSION=$(yq eval '.version' "$CHART_FILE")
              BASE_VERSION="${CURRENT_VERSION%%-beta*}"
              NEW_VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
              # Only set a prerelease suffix once. If already beta, keep it.
              if [[ "$CURRENT_VERSION" == "$BASE_VERSION" ]]; then
                echo "Updating chart version in $CHART_FILE to $NEW_VERSION"
                yq eval -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"
                git add "$CHART_FILE"
                CHANGED=true
              fi
            fi
          done

          # Commit prerelease versions so chart-releaser can detect chart changes from git history.
          if [ "$CHANGED" = true ] && [ "${{ github.actor }}" != "github-actions[bot]" ]; then
            # Keep umbrella local dependency versions aligned with prerelease version.
            if [ -f ./helm/metranova/Chart.yaml ]; then
              METRANOVA_VERSION=$(yq eval '.version' ./helm/metranova/Chart.yaml)
              yq eval -i '(.dependencies[] | select(.repository | startswith("file://../charts/")) | .version) = strenv(METRANOVA_VERSION)' ./helm/metranova/Chart.yaml
              git add ./helm/metranova/Chart.yaml
            fi

            git commit -m "chore: set prerelease chart versions for run ${GITHUB_RUN_NUMBER}"
            git push
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease versions committed. This run will stop before publishing."
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip version mutation on non-release branches
        if: github.ref_name != 'main' && steps.branch_gate.outputs.is_release_branch != 'true'
        run: |
          echo "Branch '${{ github.ref_name }}' is not a release-style branch."
          echo "Skipping chart version mutation steps."

      - name: Configure Helm repositories
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts --force-update
          helm repo update

      - name: Run chart-releaser (component charts)
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: ./helm/charts
          # Keep reruns idempotent by not failing when a chart release tag already exists.
          skip_existing: true
          mark_as_latest: ${{ github.ref_name == 'main' }}

      - name: Reset chart-releaser index workspace
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        run: |
          rm -rf .cr-index

      - name: Package umbrella chart
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          helm dependency build helm/metranova
          helm package helm/metranova --destination .cr-release-packages

      - name: Install chart-releaser CLI
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        run: |
          CR_VERSION="v1.7.0"
          curl -sSL -o cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/${CR_VERSION}/chart-releaser_${CR_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz cr
          chmod +x cr
          mv cr "$RUNNER_TEMP/cr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish umbrella chart package
        if: steps.version_check.outputs.version_changed != 'true' && steps.prerelease_version.outputs.version_changed != 'true'
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"

          # Upload pre-packaged umbrella chart artifact as a GitHub release asset.
          cr upload \
            --owner "$OWNER" \
            --git-repo "$REPO" \
            --package-path .cr-release-packages \
            --token "$CR_TOKEN" \
            --skip-existing

          # Regenerate and push index.yaml to gh-pages.
          mkdir -p .cr-index
          cr index \
            --owner "$OWNER" \
            --git-repo "$REPO" \
            --package-path .cr-release-packages \
            --index-path .cr-index/index.yaml \
            --token "$CR_TOKEN" \
            --push
